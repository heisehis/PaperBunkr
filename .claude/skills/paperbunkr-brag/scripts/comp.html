<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paperbunkr edit</title>
<style>
@font-face { font-family: 'Bebas'; src: url(assets/bebas.woff2) format('woff2'); }
@font-face { font-family: 'Serif4'; src: url(assets/serif.woff2) format('woff2'); font-weight: 200 900; }
:root { --bg:#0b0b0b; --panel:#161513; --line:#2b2926; --text:#f7f6f2; --muted:rgba(247,246,242,.7);
        --accent:#f7931e; --yellow:#f2c94c; --on-accent:#0b0b0b; }
html,body { margin:0; background:#000; }
#stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:'Serif4', Georgia, serif; color:var(--text); }
.abs { position:absolute; }
.bebas { font-family:'Bebas', Impact, sans-serif; font-weight:400; letter-spacing:.015em; line-height:.92; }
.kicker { font-size:24px; letter-spacing:.26em; text-transform:uppercase; color:var(--yellow); font-weight:600; }
#amb { position:absolute; inset:-80px; width:2080px; height:1240px; object-fit:cover; filter:blur(48px) saturate(1.2); opacity:0; }
#ambShade { position:absolute; inset:0; background:radial-gradient(1200px 700px at 50% 45%, rgba(11,11,11,.35), rgba(11,11,11,.85)); }
#wall { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; opacity:0; transform-origin:50% 50%; }
#wallShade { position:absolute; inset:0; background:radial-gradient(1100px 620px at 50% 50%, rgba(11,11,11,.45), rgba(11,11,11,.93)); opacity:0; }
.win { position:absolute; overflow:hidden; border-radius:14px; box-shadow:0 40px 110px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07); opacity:0; transform-origin:50% 50%; background:#000; }
.win img { width:100%; height:100%; object-fit:cover; display:block; transform-origin:50% 50%; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
.hook { position:absolute; left:0; right:0; text-align:center; text-shadow:0 10px 60px rgba(0,0,0,.75); opacity:0; }
#logoBox { position:absolute; left:0; right:0; top:0; opacity:0; }
#logoImg { position:absolute; left:50%; width:400px; margin-left:-200px; top:190px; transform-origin:50% 0; }
#logoKick, #logoTag { position:absolute; left:0; right:0; text-align:center; opacity:0; }
#logoKick { top:600px; } #logoTag { top:642px; font-size:42px; }
#label { position:absolute; left:100px; top:928px; }
#label .kicker, #label .big { opacity:0; }
#label .big { font-size:112px; margin-top:10px; white-space:nowrap; }
.center { position:absolute; left:0; right:0; text-align:center; font-size:230px; opacity:0; }
#cap { position:absolute; left:210px; top:846px; }
#cap > div { opacity:0; }
#cap .title { font-size:84px; margin-top:10px; white-space:nowrap; }
#capLine { position:absolute; left:210px; top:978px; font-size:34px; color:var(--muted); opacity:0; white-space:nowrap; }
#outro { position:absolute; inset:0; opacity:0; background:var(--bg); }
#outro .lock { position:absolute; left:50%; width:780px; margin-left:-390px; top:150px; opacity:0; }
#facts { position:absolute; left:50%; top:470px; width:1760px; margin-left:-880px; display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
.fact { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:30px 30px 32px; opacity:0; }
.fact .t { font-size:46px; white-space:nowrap; }
.fact .d { font-size:23px; color:var(--muted); margin-top:12px; line-height:1.35; }
#cta { position:absolute; left:0; right:0; top:720px; display:flex; flex-direction:column; align-items:center; }
#btn { display:flex; align-items:center; gap:16px; background:var(--accent); color:var(--on-accent); font-size:36px; font-weight:650; padding:22px 40px; border-radius:12px; opacity:0; }
#btn svg { width:38px; height:38px; }
#url { margin-top:30px; font-size:32px; color:var(--muted); opacity:0; }
#url b { color:var(--text); font-weight:600; }
#soc { margin-top:26px; display:flex; align-items:center; gap:16px; opacity:0; }
#soc .b { width:60px; height:60px; border-radius:16px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
#soc svg { width:30px; height:30px; fill:var(--text); }
#soc span { font-size:34px; font-weight:600; color:var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <img id="amb"><div id="ambShade"></div>
  <img id="wall"><div id="wallV" class="abs" style="inset:0;opacity:0"></div><div id="wallShade"></div>
  <div class="win" id="winPrev"><img></div>
  <div class="win" id="winCur"><img></div>
  <div id="flash"></div>

  <div class="hook bebas" id="hook1"></div>
  <div class="hook bebas" id="hook2" style="color:var(--accent)"></div>
  <div id="logoBox">
    <img id="logoImg" src="assets/stacked.png">
    <div class="kicker" id="logoKick"></div>
    <div id="logoTag">A library and reader for comics, manga and books.</div>
  </div>

  <div id="label"><div class="kicker" id="labKick"></div><div class="big bebas" id="labBig"></div></div>
  <div class="center bebas" id="center1"></div>
  <div class="center bebas" id="center2" style="color:var(--accent)"></div>

  <div id="cap"><div class="kicker" id="capKick"></div><div class="title bebas" id="capTitle"></div></div>
  <div id="capLine"></div>

  <div id="outro">
    <img class="lock" src="assets/horizontal.png">
    <div id="facts"></div>
    <div id="cta">
      <div id="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Download for Windows</div>
      <div id="url">Free · <b>github.com/heisehis/PaperBunkr</b></div>
      <div id="soc"><div class="b"><svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></div><span>@Ehis_II</span></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const oCub = k => 1 - Math.pow(1 - k, 3);
const oExp = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const ioCub = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const oBack = k => { const c = 1.5; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const show = (el, op, tf) => { el.style.opacity = op; if (tf !== undefined) el.style.transform = tf; };

const params = new URLSearchParams(location.search);
const TLNAME = params.get('tl') || 'A';
const V = params.get('fmt') === 'v';   // vertical 1080x1920
const FPS = 30;
let TL, HYPE, WIN;

function loadTL() {
  return new Promise(res => { const s = document.createElement('script'); s.src = `timeline_${TLNAME}.js`; s.onload = res; document.head.appendChild(s); });
}

function shotSrc(s, t) {
  if (s.kind === 'still') return `stills_src/${s.key}.jpg`;
  const idx = clamp(Math.floor((t - s.t0) * FPS * s.speed), 0, s.n - 1);
  return `${s.dir}/${String(idx + 1).padStart(4, '0')}.jpg`;
}
const pending = [];
function setSrc(img, src) {
  if (img.dataset.src === src) return;
  img.dataset.src = src; img.src = src;
  pending.push(img.decode().catch(() => {}));
}

function placeWin(el) {
  Object.assign(el.style, { left: WIN.x + 'px', top: WIN.y + 'px', width: WIN.w + 'px', height: WIN.h + 'px' });
}

// vertical: the card shows a square crop of the frame, centred on the shot's focus point and panning slowly
function cardTf(s, prog, kb) {
  if (!V) return `scale(${kb})`;
  const W = WIN.h * 1.96;
  const fx = (s.fx ?? .5) + (s.pan ?? .06) * (prog - .5);
  const x = clamp(WIN.w / 2 - fx * W, WIN.w - W, 0);
  return `translateX(${x}px) scale(${kb})`;
}
function cardOrigin(s, prog) {
  if (!V) return '50% 50%';
  const W = WIN.h * 1.96, fx = (s.fx ?? .5) + (s.pan ?? .06) * (prog - .5);
  return `${clamp(fx * W, WIN.w / 2, W - WIN.w / 2)}px 50%`;
}
function textAt(t, type) { return TL.texts.filter(x => x.type === type && t >= x.t0 && t < x.t1); }

window.renderAt = async function (t) {
  pending.length = 0;
  const shots = TL.shots;
  // ---------- wall (hook background)
  const wall = shots.find(s => s.style === 'wall');
  const wallOn = wall && t < wall.t1 + (HYPE ? 0 : .3);
  if (wallOn) {
    setSrc($('wall'), shotSrc(wall, Math.min(t, wall.t1 - .01)));
    const logo = TL.texts.find(x => x.type === 'logo');
    const dimK = seg(t, logo.t0 - .2, logo.t0 + .3);
    const fadeOut = HYPE ? 1 : 1 - seg(t, wall.t1 - .05, wall.t1 + .3);
    const inK = seg(t, 0, HYPE ? .15 : .6);
    if (V) {
      $('wall').style.opacity = 0;
      [...$('wallV').children].forEach((im, i) => {
        setSrc(im, shotSrc(wall, clamp(Math.min(t, wall.t1 - .01) + i * 1.3, 0, wall.t1 + .35)));
        im.style.transform = `translateX(${(i % 2 ? -1 : 1) * (30 - 60 * seg(t, 0, wall.t1))}px) scale(1.08)`;
      });
      $('wallV').style.opacity = inK * lerp(.75, .32, dimK) * fadeOut;
    } else
    show($('wall'), inK * lerp(.75, .32, dimK) * fadeOut, `scale(${1.12 - .06 * seg(t, 0, wall.t1)}) rotate(-2deg)`);
    $('wallShade').style.opacity = (lerp(.55, .9, dimK)) * fadeOut;
  } else { $('wall').style.opacity = 0; $('wallV').style.opacity = 0; $('wallShade').style.opacity = 0; }

  // ---------- windows
  const wins = shots.filter(s => s.style === 'window');
  const ci = wins.findIndex(s => t >= s.t0 && t < s.t1);
  const cur = ci >= 0 ? wins[ci] : null;
  const prev = ci > 0 && Math.abs(wins[ci - 1].t1 - cur.t0) < 1e-3 ? wins[ci - 1] : null;
  const wc = $('winCur'), wp = $('winPrev');
  wp.style.opacity = 0; wc.style.clipPath = 'none';
  let flash = 0;
  if (cur) {
    const dt = t - cur.t0, prog = seg(t, cur.t0, cur.t1);
    setSrc(wc.firstElementChild, shotSrc(cur, t));
    const kb = cur.kb ? 1 + .06 * prog : 1;
    wc.firstElementChild.style.transformOrigin = cardOrigin(cur, prog);
    wc.firstElementChild.style.transform = cardTf(cur, prog, kb);
    if (HYPE) {
      const p = cur.punch ? 1 + .045 * (1 - oExp(seg(dt, 0, .28))) : 1;
      show(wc, 1, `scale(${p})`);
      flash = (cur.flash || 0) * (1 - seg(dt, 0, cur.flash > .5 ? .22 : .1));
    } else if (cur.wipe && prev) {
      const k = ioCub(seg(dt, 0, .38));
      show(wc, 1, 'none');
      wc.style.clipPath = `inset(0 ${(1 - k) * 100}% 0 0 round 14px)`;
      if (k < 1) { setSrc(wp.firstElementChild, shotSrc(prev, prev.t1 - .01)); wp.firstElementChild.style.transform = cardTf(prev, 1, 1); show(wp, 1, 'none'); }
    } else {
      // stagger: old out 0-.12s, new in .08-.3s (first window rises in from below)
      const first = ci === 0 || !prev;
      const k = oCub(seg(dt, first ? 0 : .08, first ? .6 : .3));
      show(wc, k, first ? `translateY(${(1 - k) * 80}px) scale(${.96 + .04 * k})` : `translateX(${(1 - k) * 50}px)`);
      if (prev && dt < .14) {
        setSrc(wp.firstElementChild, shotSrc(prev, prev.t1 - .01));
        wp.firstElementChild.style.transform = cardTf(prev, 1, prev.kb ? 1.06 : 1);
        show(wp, 1 - seg(dt, 0, .12), `translateX(${-seg(dt, 0, .12) * 40}px)`);
      }
    }
    // ambient glow from the current frame
    setSrc($('amb'), wc.firstElementChild.dataset.src);
    $('amb').style.opacity = HYPE ? .55 : .4;
  } else { wc.style.opacity = 0; $('amb').style.opacity = 0; }
  // the window block ends where the outro starts
  const outro = TL.texts.find(x => x.type === 'outro');
  $('flash').style.opacity = flash;

  // ---------- hook lines
  for (const [id, type, top] of [['hook1', 'hook', V ? 600 : HYPE ? 270 : 290], ['hook2', 'hook2', V ? 790 : 520]]) {
    const el = $(id); const x = textAt(t, type)[0];
    if (x) {
      el.textContent = x.text; el.style.top = top + 'px'; el.style.fontSize = (V ? 172 : HYPE ? 240 : 200) + 'px';
      const k = oExp(seg(t, x.t0, x.t0 + (HYPE ? .25 : .5)));
      const out = HYPE ? 1 : 1 - seg(t, x.t1 - .25, x.t1);
      show(el, k * out, `translateY(${(1 - k) * (HYPE ? 0 : 40)}px) scale(${HYPE ? 1.3 - .3 * k : 1})`);
    } else el.style.opacity = 0;
  }
  // ---------- logo
  const lg = textAt(t, 'logo')[0];
  if (lg) {
    const out = HYPE ? 1 : 1 - seg(t, lg.t1 - .3, lg.t1);
    $('logoBox').style.opacity = out;
    const kl = oBack(seg(t, lg.t0, lg.t0 + .5));
    show($('logoImg'), clamp(seg(t, lg.t0, lg.t0 + .15)), `scale(${.82 + .18 * kl})`);
    const kk = oExp(seg(t, lg.kick, lg.kick + .45)), kt = oExp(seg(t, lg.tag, lg.tag + .45));
    show($('logoKick'), kk, `translateY(${(1 - kk) * 26}px)`);
    show($('logoTag'), kt, `translateY(${(1 - kt) * 26}px)`);
  } else $('logoBox').style.opacity = 0;

  // ---------- hype labels
  const lab = textAt(t, 'label')[0];
  if (lab && HYPE) {
    const prevLab = TL.texts.find(x => x.type === 'label' && Math.abs(x.t1 - lab.t0) < 1e-3);
    $('labKick').textContent = lab.kick; $('labBig').textContent = lab.text;
    const k = oExp(seg(t, lab.t0, lab.t0 + .22));
    const sameKick = prevLab && prevLab.kick === lab.kick;
    show($('labKick'), sameKick ? 1 : k, `translateX(${sameKick ? 0 : (1 - k) * -30}px)`);
    show($('labBig'), k, `translateX(${(1 - k) * -40}px)`);
  } else { $('labKick').style.opacity = 0; $('labBig').style.opacity = 0; }

  // ---------- hype center words (breaks)
  for (const [id, type, top] of [['center1', 'center', V ? 650 : 300], ['center2', 'center2', V ? 870 : 540]]) {
    const el = $(id); const x = textAt(t, type)[0];
    if (x) { el.textContent = x.text; el.style.top = top + 'px'; const k = oExp(seg(t, x.at, x.at + .2)); show(el, k, `scale(${1.25 - .25 * k})`); }
    else el.style.opacity = 0;
  }

  // ---------- polished captions
  const cp = textAt(t, 'caption')[0];
  if (cp && !HYPE) {
    $('capKick').textContent = cp.kick; $('capTitle').textContent = cp.text;
    const out = 1 - seg(t, cp.t1 - .14, cp.t1);
    const kk = oExp(seg(t, cp.t0 + .1, cp.t0 + .55)), kt = oExp(seg(t, cp.t0 + .18, cp.t0 + .7));
    show($('capKick'), kk * out, `translateY(${(1 - kk) * 24}px)`);
    show($('capTitle'), kt * out, `translateY(${(1 - kt) * 30}px)`);
  } else { $('capKick').style.opacity = 0; $('capTitle').style.opacity = 0; }
  const ln = textAt(t, 'line')[0];
  if (ln && !HYPE) {
    const prevLn = TL.texts.find(x => x.type === 'line' && Math.abs(x.t1 - ln.t0) < 1e-3);
    $('capLine').textContent = ln.text;
    const same = prevLn && prevLn.text === ln.text;
    const k = same ? 1 : oCub(seg(t, ln.t0 + .1, ln.t0 + .4));
    const nextLn = TL.texts.find(x => x.type === 'line' && Math.abs(x.t0 - ln.t1) < 1e-3);
    const out = nextLn && nextLn.text === ln.text ? 1 : 1 - seg(t, ln.t1 - .1, ln.t1);
    show($('capLine'), k * out, `translateY(${(1 - k) * 14}px)`);
  } else $('capLine').style.opacity = 0;

  // ---------- outro
  if (outro && t >= outro.t0) {
    const o = $('outro');
    o.style.opacity = HYPE ? 1 : seg(t, outro.t0, outro.t0 + .3);
    const kb = oExp(seg(t, outro.t0, outro.t0 + .6));
    show(o.querySelector('.lock'), kb, `translateY(${(1 - kb) * 40}px) scale(${1.08 - .08 * kb})`);
    [...document.querySelectorAll('.fact')].forEach((f, i) => {
      const k = oExp(seg(t, outro.facts[i], outro.facts[i] + .45)); show(f, k, `translateY(${(1 - k) * 60}px)`);
    });
    const kc = oBack(seg(t, outro.cta, outro.cta + .45));
    show($('btn'), clamp(seg(t, outro.cta, outro.cta + .15)), `scale(${.8 + .2 * kc})`);
    const ku = oExp(seg(t, outro.cta + .25, outro.cta + .7));
    show($('url'), ku, `translateY(${(1 - ku) * 30}px)`);
    const ks = oExp(seg(t, outro.cta + .5, outro.cta + .95)); show($('soc'), ks, `translateY(${(1 - ks) * 24}px)`);
  } else $('outro').style.opacity = 0;

  await Promise.all(pending);
};

window.ready = (async () => {
  await loadTL();
  TL = window.TL; HYPE = TL.look === 'hype';
  WIN = V ? { x: 40, y: 350, w: 1000, h: 1000 } : HYPE ? { x: 100, y: 28, w: 1720, h: 878 } : { x: 210, y: 50, w: 1500, h: 765 };
  if (V) {
    // first words on frame 0 for scrollers (t=0 is the first downbeat)
    const h = TL.texts.find(x => x.type === 'hook'); if (h) h.t0 = 0;
    const st = document.createElement('style');
    st.textContent = `
      #stage { width:1080px; height:1920px; }
      #amb { width:1240px; height:2080px; }
      .win img { position:absolute; left:0; top:0; height:1000px; width:${Math.round(1000 * 1.96)}px; object-fit:cover; }
      #wallV img { position:absolute; left:0; width:1080px; height:640px; object-fit:cover; }
      #logoImg { width:560px; margin-left:-280px; top:420px; }
      #logoTag { font-size:46px; padding:0 90px; line-height:1.3; }
      #label { left:60px; top:165px; }
      .center { font-size:180px; }
      #cap { left:60px; top:160px; }
      #cap .title { font-size:88px; }
      #capLine { left:60px; top:1385px; width:960px; white-space:normal; font-size:38px; line-height:1.3; }
      #outro .lock { width:500px; margin-left:-250px; top:190px; }
      #facts { width:960px; margin-left:-480px; top:740px; grid-template-columns:repeat(2,1fr); gap:20px; }
      .fact { padding:28px 28px 30px; }
      .fact .t { font-size:44px; }
      #cta { top:1150px; }`;
    document.head.appendChild(st);
    document.querySelector('#outro .lock').src = 'assets/stacked.png';
    for (let i = 0; i < 3; i++) { const im = document.createElement('img'); im.style.top = (i * 640) + 'px'; $('wallV').appendChild(im); }
  }
  placeWin($('winCur')); placeWin($('winPrev'));
  $('logoKick').style.display = 'none'; $('logoTag').style.top = V ? '960px' : '606px';   // no kicker under the logo in either edit
  const facts = HYPE
    ? [['Local-first', 'No cloud, no telemetry'], ['No account', 'Your library stays yours'], ['Reads it all', 'CBZ · CBR · PDF · EPUB · FB2 · MOBI'], ['Updates itself', 'Self-contained Windows installer']]
    : [['Free & open source', 'AGPL-3.0, no paid tier'], ['Local-first', 'No cloud, no account, no telemetry'], ['Reads it all', 'CBZ · CBR · PDF · EPUB · FB2 · MOBI'], ['Updates itself', 'Self-contained Windows installer']];
  $('facts').innerHTML = facts.map(([a, b]) => `<div class="fact"><div class="t bebas">${a.replace('&', '&amp;')}</div><div class="d">${b}</div></div>`).join('');
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await renderAt(0);
  return true;
})();
</script>
</body>
</html>
